name: ci-cross

# macOS and Windows (v4 phase A1, ADR-052). The repo is public, so GitHub's standard runners cost
# nothing: this runs on every push like ci.yml. (A "Run workflow" button would only appear once
# this file is on the default branch, main, which waits for the final research tag: ADR-034.)
on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners turn LF into CRLF on checkout; Kestrel hashes its datasets and configs.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      # rustup on the runner reads rust-toolchain.toml and installs the pinned toolchain
      - run: rustc -V && cargo -V
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The code sandbox on this OS: real Python in WebAssembly (v4 A4).
      - run: scripts/fetch_python_wasi.sh
        shell: bash
      - run: cargo test -p kestrel-sandbox -- --include-ignored --test-threads=1
      - run: cargo test -p kestrel-cli -- --include-ignored sandbox:: code::

  llama:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - run: rustc -V && cargo -V
      # The service (`kestrel serve`) and the model worker only build with this feature; it builds
      # llama.cpp with cmake (~10-20 min).
      - run: cargo clippy -p kestrel-cli --all-targets --features llama -- -D warnings
