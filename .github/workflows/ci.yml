name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup on the runner reads rust-toolchain.toml and installs the pinned toolchain
      - run: rustc -V && cargo -V
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.lock
      # exit code 5 = no tests collected yet; anything else must pass
      - run: pytest || [ $? -eq 5 ]
