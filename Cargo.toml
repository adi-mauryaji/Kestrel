[workspace]
resolver = "3"
members = ["apps/cli", "crates/kestrel-bench", "crates/kestrel-core", "crates/kestrel-inference", "crates/kestrel-learning", "crates/kestrel-memory", "crates/kestrel-nlu", "crates/kestrel-platform", "crates/kestrel-router", "crates/kestrel-tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

# Exact pins (`=x.y.z`) for runtime bindings (Ch. 45.2). Add shared deps here.
[workspace.dependencies]
kestrel-bench = { path = "crates/kestrel-bench" }
kestrel-core = { path = "crates/kestrel-core" }
kestrel-inference = { path = "crates/kestrel-inference" }
kestrel-learning = { path = "crates/kestrel-learning" }
kestrel-memory = { path = "crates/kestrel-memory" }
kestrel-nlu = { path = "crates/kestrel-nlu" }
kestrel-platform = { path = "crates/kestrel-platform" }
kestrel-router = { path = "crates/kestrel-router" }
kestrel-tools = { path = "crates/kestrel-tools" }
# Both pinned: llama-cpp-2 asks for llama-cpp-sys-2 "^0.1.157", which alone resolves to the
# newest sys crate. sys 0.1.157 vendors llama.cpp 26394b4e = scripts/build_llama.sh (ADR-006/007).
llama-cpp-2 = "=0.1.157"
llama-cpp-sys-2 = "=0.1.157"
# SQLite compiled in (bundled 3.53.2, FTS5); only kestrel-memory uses it (Ch. 24.4, ADR-026).
# rusqlite asks for libsqlite3-sys "^0.38.2", so the sys crate is pinned too.
libsqlite3-sys = "=0.38.2"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Ch. 45.2. `-C target-cpu=native` is NOT set here: if used for benchmarks, record it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
