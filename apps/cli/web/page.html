<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kestrel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23A0441C'%3E%3Ccircle cx='16' cy='8.4' r='2.5'/%3E%3Cellipse cx='16' cy='14.8' rx='2.8' ry='5.4'/%3E%3Cpath d='M14 12.6C10.4 9.9 5.5 6.7.8 5.8c2 3.6 5.5 7 9.4 9.2 1.4.8 2.6 1.8 3.5 3.1Z'/%3E%3Cpath d='M18 12.6c3.6-2.7 8.5-5.9 13.2-6.8-2 3.6-5.5 7-9.4 9.2-1.4.8-2.6 1.8-3.5 3.1Z'/%3E%3Cpath d='M14.5 18.9 11.2 27.6c2.9 1.5 6.7 1.5 9.6 0L17.5 18.9Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* Kestrel: the bird that hovers in one place and watches the ground. The palette is its plumage
   on an overcast sky; the one bold thing is the day strip, where it hovers over now. */
:root {
  --sky: #E6ECEF;
  --paper: #F4F7F8;
  --ink: #22303A;
  --deep: #141B20;
  --wing: #56666F;
  --line: #C3CED4;
  --rufous: #A0441C;
  --sans: "Noto Sans", "Adwaita Sans", "Open Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sky: #182128;
    --paper: #202B33;
    --ink: #D8E0E4;
    --deep: #F1F4F6;
    --wing: #93A3AC;
    --line: #34434D;
    --rufous: #E58C5C;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { background: var(--sky); }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font: 400 1rem/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.narrow { font-stretch: 75%; font-variant-numeric: tabular-nums; }

.page {
  max-width: 72rem;
  margin: 0 auto;
  padding: clamp(1rem, 3.5vw, 2.75rem) clamp(1rem, 4vw, 3rem) 3rem;
}

/* Masthead: the name, and what it promises. */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem 1.5rem;
}
.name {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin: 0;
  font-size: 1.35rem;
  font-weight: 600;
  font-stretch: 75%;
  letter-spacing: 0.01em;
  color: var(--deep);
}
.name svg { width: 1.6rem; height: 1.6rem; color: var(--rufous); }
.promise { margin: 0; color: var(--wing); font-size: 0.9rem; }

/* The day: a large date, and the strip the kestrel hovers over. */
.day { margin-top: clamp(1.75rem, 4vw, 3rem); }
.date {
  margin: 0;
  font-size: clamp(2.25rem, 6.5vw, 4.25rem);
  line-height: 1;
  font-weight: 600;
  font-stretch: 75%;
  letter-spacing: -0.015em;
  color: var(--deep);
}
.strip {
  position: relative;
  height: 9.5rem;
  margin-top: 1.25rem;
}
.axis {
  position: absolute;
  left: 0; right: 0; bottom: 1.6rem;
  border-top: 2px solid var(--ink);
}
/* The part of the day already gone. */
.axis.gone { right: auto; border-top-color: var(--line); }
.hour {
  position: absolute;
  bottom: 0;
  transform: translateX(-50%);
  font-size: 0.8rem;
  color: var(--wing);
}
.hour::before {
  content: "";
  position: absolute;
  left: 50%; bottom: 1.35rem;
  height: 0.45rem;
  border-left: 1px solid var(--wing);
}
.flag {
  position: absolute;
  z-index: 2;
  bottom: 1.6rem;
  display: flex;
  align-items: flex-start;
  max-width: 13rem;
  padding: 0 0 0.15rem 0.45rem;
  border-left: 1px solid var(--ink);
  font-size: 0.85rem;
  line-height: 1.3;
  white-space: nowrap;
}
.flag b { font-weight: 600; margin-right: 0.35em; }
/* The label covers any line that crosses it. */
.flag span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 0.25rem;
  background: var(--sky);
}
.flag.flip span { padding: 0 0 0 0.25rem; }
.flag.flip {
  transform: translateX(-100%);
  padding: 0 0.45rem 0.15rem 0;
  border-left: 0;
  border-right: 1px solid var(--ink);
}
.flag.rang { color: var(--wing); border-color: var(--wing); }
.now {
  position: absolute;
  top: 0; bottom: 1.6rem;
  border-left: 2px solid var(--rufous);
  color: var(--rufous);
}
.now svg {
  position: absolute;
  top: -0.6rem; left: -1.4rem;
  width: 2.8rem; height: 2.8rem;
}
.now span {
  position: absolute;
  top: 0.35rem; left: 1.55rem;
  font-size: 0.85rem;
  font-weight: 600;
}
.quiet-day {
  position: absolute;
  left: 0; bottom: 2.4rem;
  margin: 0;
  color: var(--wing);
  font-size: 0.9rem;
}
/* While Kestrel thinks, it hovers: the page's one motion, and only then. */
.thinking .now svg { animation: hover 1.1s ease-in-out infinite alternate; }
@keyframes hover { from { transform: translateY(0); } to { transform: translateY(-5px); } }
@media (prefers-reduced-motion: reduce) { .thinking .now svg { animation: none; } }

/* Below the day: the conversation, and the tasks beside it. */
.work {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: clamp(1.5rem, 4vw, 3.5rem);
  margin-top: clamp(1.5rem, 3vw, 2.25rem);
  padding-top: clamp(1.25rem, 2.5vw, 2rem);
  border-top: 1px solid var(--line);
}
h2 {
  margin: 0 0 0.75rem;
  font-size: 1.05rem;
  font-weight: 600;
  font-stretch: 75%;
  color: var(--deep);
}

/* Newest first, under the box you type in, like a notebook's latest page. */
.log {
  list-style: none;
  margin: 1.5rem 0 0;
  padding: 0;
}
.turn { padding: 0 0 1.1rem; }
.said { margin: 0; font-weight: 600; color: var(--deep); overflow-wrap: anywhere; }
.reply {
  margin: 0.3rem 0 0 0.1rem;
  padding-left: 0.85rem;
  border-left: 2px solid var(--line);
}
.reply p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.reply .wait { color: var(--wing); }
.reply .trouble { color: var(--rufous); }
.question {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 0.75rem;
  margin: 0.4rem 0;
}
.question p { font-weight: 600; }
.welcome { color: var(--wing); margin: 0 0 1rem; max-width: 34rem; }

.ask {
  display: flex;
  gap: 0.5rem;
}
.ask input {
  flex: 1;
  min-width: 0;
  padding: 0.7rem 0.85rem;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 0.5rem;
}
.ask input::placeholder { color: var(--wing); opacity: 1; }
.ask input:focus-visible { outline-offset: 0; }
.send {
  padding: 0.7rem 1.15rem;
  border: 0;
  border-radius: 0.5rem;
  background: var(--ink);
  color: var(--sky);
  font-weight: 600;
  cursor: pointer;
}
.send:disabled { opacity: 0.55; cursor: default; }
.try {
  margin: 0.6rem 0 0;
  color: var(--wing);
  font-size: 0.875rem;
}
.try button {
  margin: 0.15rem 0.35rem 0 0;
  padding: 0.1rem 0.5rem;
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink);
  cursor: pointer;
}
.try button:hover { border-color: var(--wing); }
.answer {
  padding: 0.3rem 0.9rem;
  border-radius: 0.4rem;
  border: 1px solid var(--ink);
  background: none;
  cursor: pointer;
  font-weight: 600;
}
.answer.yes { background: var(--ink); color: var(--sky); }

/* Tasks: grouped by when, the soonest first. */
.group { margin: 0 0 1.25rem; }
.group h3 {
  display: flex;
  justify-content: space-between;
  margin: 0 0 0.25rem;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--wing);
}
.group ul { list-style: none; margin: 0; padding: 0; }
.task {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.15rem 0.75rem;
  align-items: baseline;
  padding: 0.45rem 0;
  border-bottom: 1px solid var(--line);
}
.task:last-child { border-bottom: 0; }
.task .what { overflow-wrap: anywhere; }
.task .when { grid-column: 1; font-size: 0.85rem; color: var(--wing); }
.task.late .when { color: var(--ink); font-weight: 600; }
.done {
  grid-column: 2; grid-row: 1 / span 2;
  align-self: center;
  padding: 0.2rem 0.6rem;
  background: none;
  border: 1px solid var(--line);
  border-radius: 0.3rem;
  color: var(--ink);
  font-size: 0.85rem;
  cursor: pointer;
}
.done:hover { border-color: var(--ink); }
.task.finishing { opacity: 0.45; }
.task.finishing .what { text-decoration: line-through; }
.empty { color: var(--wing); margin: 0; }

@media (max-width: 52rem) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .strip { height: 10.5rem; }
  .flag { max-width: 9.5rem; }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1 class="name">
      <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#kestrel"/></svg>
      Kestrel
    </h1>
    <p class="promise">Runs on this laptop. Nothing you type leaves it.</p>
  </header>

  <section class="day" aria-labelledby="date">
    <h2 class="date" id="date">Today</h2>
    <div class="strip narrow" id="strip" aria-hidden="true"></div>
    <p class="sr" id="day-summary" aria-live="polite"></p>
  </section>

  <main class="work">
    <section aria-labelledby="talk-h">
      <h2 id="talk-h">Talk to Kestrel</h2>
      <p class="welcome" id="welcome">Ask in English or Hinglish. It keeps your tasks, reminds you at the time you say, and finds, opens and summarizes your notes.</p>
      <form class="ask" id="ask">
        <label class="sr" for="say">Tell Kestrel</label>
        <input id="say" name="say" autocomplete="off" spellcheck="false"
               placeholder="kal shaam 6 baje bill bharna yaad dila dena">
        <button class="send" id="send" type="submit">Send</button>
      </form>
      <p class="try" id="try">Try
        <button type="button">mere tasks btao</button>
        <button type="button">remind me to call Asha at 5 pm</button>
        <button type="button">summarize my latest note</button>
      </p>
      <ol class="log" id="log" aria-live="polite" aria-label="Conversation, newest first"></ol>
    </section>

    <aside aria-labelledby="tasks-h">
      <h2 id="tasks-h">Tasks</h2>
      <div id="tasks"><p class="empty">Loading your tasks</p></div>
    </aside>
  </main>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="kestrel" viewBox="0 0 32 32">
    <g fill="currentColor">
      <circle cx="16" cy="8.4" r="2.5"/>
      <ellipse cx="16" cy="14.8" rx="2.8" ry="5.4"/>
      <path d="M14 12.6C10.4 9.9 5.5 6.7.8 5.8c2 3.6 5.5 7 9.4 9.2 1.4.8 2.6 1.8 3.5 3.1Z"/>
      <path d="M18 12.6c3.6-2.7 8.5-5.9 13.2-6.8-2 3.6-5.5 7-9.4 9.2-1.4.8-2.6 1.8-3.5 3.1Z"/>
      <path d="M14.5 18.9 11.2 27.6c2.9 1.5 6.7 1.5 9.6 0L17.5 18.9Z"/>
    </g>
  </symbol>
</svg>

<script>
"use strict";
// The key comes in the address fragment from `kestrel open` (never sent to a server); it is kept
// in this browser so a bookmark of the plain address keeps working, and taken out of the address.
const KEY = "kestrel-token";
const token = (() => {
  const m = location.hash.match(/t=([0-9a-f]{64})/);
  if (m) {
    try { localStorage.setItem(KEY, m[1]); } catch (e) { /* private window: this visit only */ }
    history.replaceState(null, "", location.pathname);
    return m[1];
  }
  try { return localStorage.getItem(KEY); } catch (e) { return null; }
})();

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
let busy = false;

function api(path, body) {
  const headers = { "X-Kestrel-Token": token || "" };
  if (body) headers["Content-Type"] = "application/json";
  return fetch(path, { method: body ? "POST" : "GET", headers, body: body && JSON.stringify(body) });
}

// --- The day -------------------------------------------------------------------------------
const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const minutes = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const asDate = (iso) => new Date(iso + "T12:00:00");
const pct = (m) => (m / 1440 * 100).toFixed(3) + "%";

function drawDay(data) {
  $("date").textContent = asDate(data.today).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const strip = $("strip");
  strip.replaceChildren();
  const gone = el("div", "axis gone");
  gone.style.width = pct(data.minute);
  strip.append(el("div", "axis"), gone);
  for (let h = 0; h <= 24; h += 3) {
    const t = el("span", "hour", String(h).padStart(2, "0"));
    t.style.left = pct(h * 60);
    if (h === 0) t.style.transform = "none";
    if (h === 24) t.style.transform = "translateX(-100%)";
    strip.append(t);
  }
  const timed = data.tasks
    .filter((t) => t.due === data.today && t.time)
    .map((t) => ({ ...t, m: minutes(t.time) }))
    .sort((a, b) => a.m - b.m || a.id - b.id);
  // Two passes. First each flag picks its side of the stem (where more of the strip is free up to
  // the now line or the edge) and the lowest of three rows where its label overlaps no other.
  // Then each label is cut just before whatever lies on its side: the now line, a taller stem
  // (it rises through this row), the next label, the edge; the time always shows. On a narrow
  // screen flags show only their time (the task list has the titles).
  const width = strip.clientWidth || 1;
  const nowX = data.minute / 1440 * width;
  const narrow = width < 560;
  const flags = [];
  for (const t of timed) {
    const f = el("div", "flag" + (t.m <= data.minute ? " rang" : ""));
    const label = el("span");
    const time = el("b", "", t.time);
    label.append(time);
    if (!narrow) label.append(document.createTextNode(t.title));
    f.append(label);
    f.title = t.time + " " + t.title;
    f.style.left = pct(t.m);
    strip.append(f);
    const x = t.m / 1440 * width;
    const right = (nowX > x ? nowX : width) - x;
    const left = x - (nowX < x ? nowX : 0);
    const w = f.offsetWidth;
    const flip = right < w && left > right;
    flags.push({ f, x, w, flip, min: time.offsetWidth + 26, span: flip ? [x - w, x] : [x, x + w] });
  }
  const rows = [[], [], []];
  for (const g of flags) {
    const overlaps = (row) => row.filter((o) => g.span[0] < o.span[1] + 6 && g.span[1] + 6 > o.span[0]).length;
    g.r = rows.findIndex((row) => overlaps(row) === 0);
    if (g.r < 0) g.r = [0, 1, 2].reduce((a, b) => (overlaps(rows[b]) < overlaps(rows[a]) ? b : a));
    rows[g.r].push(g);
  }
  for (const g of flags) {
    let limit = g.flip ? 0 : width;
    const block = (v) => {
      if (!g.flip && v > g.x + 1 && v < limit) limit = v;
      if (g.flip && v < g.x - 1 && v > limit) limit = v;
    };
    block(nowX);
    for (const o of flags) {
      if (o === g) continue;
      if (o.r > g.r) block(o.x);
      if (o.r === g.r) block(g.flip ? o.span[1] : o.span[0]);
    }
    const room = Math.max(Math.abs(limit - g.x) - 6, g.min);
    const label = g.f.querySelector("span");
    if (room < g.min + 28) {
      // Too little room for any of the title: the time alone, without a cut mark.
      if (label.lastChild.nodeType === Node.TEXT_NODE) label.lastChild.remove();
    } else if (room < g.w) {
      g.f.style.maxWidth = `${room}px`;
    }
    if (g.flip) g.f.classList.add("flip");
    // Each row up is a longer stem from the axis.
    g.f.style.height = `${1.5 + g.r * 1.55}rem`;
  }
  if (!timed.length) strip.append(el("p", "quiet-day", "Nothing timed today. Say a time and it shows up here."));
  const now = el("div", "now");
  now.style.left = pct(data.minute);
  now.innerHTML = '<svg viewBox="0 0 32 32"><use href="#kestrel"/></svg>';
  now.append(el("span", "", hhmm(data.minute)));
  if (data.minute > 1440 - 120) now.querySelector("span").style.left = "-4.3rem";
  strip.append(now);
  const later = timed.filter((t) => t.m > data.minute);
  $("day-summary").textContent = later.length
    ? `Still today: ${later.map((t) => t.time + " " + t.title).join(", ")}.`
    : "Nothing else timed today.";
}

// --- Tasks ---------------------------------------------------------------------------------
const shortDay = (iso) => asDate(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });

function drawTasks(data) {
  const box = $("tasks");
  box.replaceChildren();
  const byTime = (a, b) => (a.due || "").localeCompare(b.due || "") || (a.time ? 0 : 1) - (b.time ? 0 : 1)
    || (a.time || "").localeCompare(b.time || "") || a.id - b.id;
  const groups = [
    ["Overdue", data.tasks.filter((t) => t.due && t.due < data.today), (t) => "since " + shortDay(t.due) + (t.time ? ", " + t.time : ""), true],
    ["Today", data.tasks.filter((t) => t.due === data.today), (t) => t.time || "any time", false],
    ["Coming up", data.tasks.filter((t) => t.due && t.due > data.today), (t) => shortDay(t.due) + (t.time ? ", " + t.time : ""), false],
    ["No date", data.tasks.filter((t) => !t.due), () => "", false],
  ];
  let any = false;
  for (const [name, tasks, when, late] of groups) {
    if (!tasks.length) continue;
    any = true;
    const g = el("section", "group");
    const h = el("h3", "", name);
    h.append(el("span", "", String(tasks.length)));
    const ul = el("ul");
    for (const t of tasks.sort(byTime)) {
      const li = el("li", "task" + (late ? " late" : ""));
      li.append(el("span", "what", t.title));
      const w = when(t);
      if (w) li.append(el("span", "when", w));
      const done = el("button", "done", "Done");
      done.type = "button";
      done.setAttribute("aria-label", `Mark “${t.title}” done`);
      done.addEventListener("click", () => {
        li.classList.add("finishing");
        send(`task ${t.id} done`);
      });
      li.append(done);
      ul.append(li);
    }
    g.append(h, ul);
    box.append(g);
  }
  if (!any) box.append(el("p", "empty", "No tasks. Say “remind me to …” and it lands here."));
}

async function refresh() {
  if (!token) return;
  try {
    const r = await api("/api/tasks");
    if (!r.ok) return;
    const data = await r.json();
    drawDay(data);
    drawTasks(data);
  } catch (e) { /* the conversation reports a stopped service */ }
}

// --- The conversation ----------------------------------------------------------------------
const KEEP_TURNS = 40;

function turn(text) {
  $("welcome").hidden = true;
  const li = el("li", "turn");
  li.append(el("p", "said", text));
  const reply = el("div", "reply");
  li.append(reply);
  const log = $("log");
  log.prepend(li);
  while (log.children.length > KEEP_TURNS) log.lastElementChild.remove();
  return reply;
}

function ask(reply, q) {
  const box = el("div", "question");
  box.append(el("p", "", q));
  let answered = false;
  const answer = async (yes) => {
    if (answered) return;
    answered = true;
    box.querySelectorAll("button").forEach((b) => b.remove());
    box.append(el("span", "wait", yes ? "You said yes" : "You said no"));
    try { await api("/api/answer", { answer: yes }); } catch (e) { /* the request below reports it */ }
  };
  const yes = el("button", "answer yes", "Yes");
  const no = el("button", "answer", "No");
  yes.type = no.type = "button";
  yes.addEventListener("click", () => answer(true));
  no.addEventListener("click", () => answer(false));
  box.append(yes, no);
  reply.append(box);
  no.focus();
  box.addEventListener("keydown", (e) => {
    if (e.key === "y") answer(true);
    if (e.key === "n") answer(false);
  });
}

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true;
  $("send").disabled = true;
  document.body.classList.add("thinking");
  const reply = turn(text);
  const wait = el("p", "wait", "Thinking");
  reply.append(wait);
  const t0 = Date.now();
  const tick = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    if (!wait.hidden) wait.textContent = s < 3 ? "Thinking" : `Thinking, ${s} s. The language model loads the first time it is needed, which takes about 20 seconds.`;
  }, 1000);
  try {
    const r = await api("/api/say", { text });
    if (r.status === 401) throw new Error("key");
    if (r.status === 409) { reply.append(el("p", "trouble", "Kestrel is waiting for your answer to its question above.")); return; }
    if (!r.ok || !r.body) throw new Error("status " + r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    let written = null; // the paragraph a skill's text grows in while it is written
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const msg = JSON.parse(buf.slice(0, nl));
        buf = buf.slice(nl + 1);
        if (msg.part !== undefined) {
          wait.hidden = true;
          if (!written) reply.append(written = el("p", "", ""));
          written.textContent += msg.part;
          continue;
        }
        written = null;
        if (msg.line !== undefined) reply.append(el("p", "", msg.line));
        if (msg.ask !== undefined) { wait.hidden = true; ask(reply, msg.ask); }
      }
    }
  } catch (e) {
    reply.append(el("p", "trouble", e.message === "key"
      ? "This page has no key. Open it with: kestrel open"
      : "Kestrel is not answering. Start it with: systemctl --user start kestrel"));
  } finally {
    clearInterval(tick);
    wait.remove();
    busy = false;
    $("send").disabled = false;
    document.body.classList.remove("thinking");
    refresh();
    $("say").focus({ preventScroll: true });
  }
}

$("ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("say").value;
  $("say").value = "";
  send(text);
});
$("try").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => send(b.textContent)));

if (!token) {
  // Without the key: today from this browser's clock, and how to get the key.
  const d = new Date();
  const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  drawDay({ today: iso, minute: d.getHours() * 60 + d.getMinutes(), tasks: [] });
  $("welcome").textContent = "This page has no key yet. Open it from a terminal with: kestrel open";
  $("tasks").replaceChildren(el("p", "empty", "Your tasks show here once the page is opened with kestrel open."));
  $("say").disabled = $("send").disabled = true;
  $("try").hidden = true;
}
refresh();
setInterval(refresh, 60 * 1000);
$("say").focus({ preventScroll: true });
</script>
