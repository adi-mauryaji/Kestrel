<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f5; --fg: #1d2421; --muted: #5b6661; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161b19; --fg: #e8ece9; --muted: #9aa5a0; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 32rem; padding: 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: .5rem 0; }
  code { font-size: .95em; }
</style>
</head>
<body>
<main>
  <h1>Kestrel is not running</h1>
  <p>On a first start, choose your notes folder: <code>kestrel settings notes ~/notes</code> in a terminal, then <b>Open Kestrel</b> from the tray icon.</p>
  <p>Otherwise, why it stopped is in <code>service.log</code> in Kestrel's log folder.</p>
</main>
</body>
</html>
