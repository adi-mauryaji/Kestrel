[[family]]
id = "fix-factorial"
type = "fix"
entry = "factorial"
code = '''
def factorial(n):
    result = 0
    for i in range(1, n + 1):
        result *= i
    return result
'''
en = ["my factorial function always gives 0, please fix it:\n{code}"]
hi-en = ["mera factorial function hamesha 0 deta hai, isko fix kar do:\n{code}"]
solution = '''
def factorial(n):
    result = 1
    for i in range(1, n + 1):
        result *= i
    return result
'''
tests = '''
assert factorial(5) == 120
assert factorial(1) == 1
assert factorial(0) == 1
'''

[[family]]
id = "fix-find-max"
type = "fix"
entry = "find_max"
code = '''
def find_max(nums):
    m = 0
    for x in nums:
        if x > m:
            m = x
    return m
'''
en = ["find_max gives the wrong answer when all the numbers are negative, fix it:\n{code}"]
hi-en = ["jab saare numbers negative hote hain tab find_max galat answer deta hai, ise theek karo:\n{code}"]
solution = '''
def find_max(nums):
    m = nums[0]
    for x in nums:
        if x > m:
            m = x
    return m
'''
tests = '''
assert find_max([-3, -1, -7]) == -1
assert find_max([1, 5, 2]) == 5
'''

