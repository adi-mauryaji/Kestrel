[[family]]
id = "fix-reverse-list"
type = "fix"
entry = "reverse_list"
code = '''
def reverse_list(xs):
    out = []
    for i in range(len(xs)):
        out.append(xs[len(xs) - i])
    return out
'''
en = ["this gives an IndexError, fix it so it returns the list reversed:\n{code}"]
hi-en = ["isme IndexError aata hai, ise aise theek karo ki ulti list return ho:\n{code}"]
solution = '''
def reverse_list(xs):
    out = []
    for i in range(len(xs)):
        out.append(xs[len(xs) - 1 - i])
    return out
'''
tests = '''
assert reverse_list([1, 2, 3]) == [3, 2, 1]
assert reverse_list([]) == []
'''

