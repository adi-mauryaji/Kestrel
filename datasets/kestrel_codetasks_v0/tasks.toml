# Kestrel-CodeTasks-v0 (DRAFT, ADR-036): small Python requests for v3's code loop, in English and Romanized
# Hinglish. Drafted by Claude on 2026-10-27; not yet reviewed by the human.
#
# type: function (the request names the function; `tests` are hidden asserts that call it) | script (reads
# stdin, prints; `cases` compare stdout, ignoring case and spacing at the ends) | fix (the request shows broken
# `code` as {code}; hidden `tests`) | explain (the request shows `code`; a right answer holds every fact in
# `facts`, any of its ways). `solution` is a reference answer: it must pass, and a fix task's `code` must fail
# (experiments/v3/test_code_eval.py). Only the standard library.

# ---- function ----

[[family]]
id = "fn-palindrome"
type = "function"
entry = "is_palindrome"
en = ["write a python function is_palindrome(s) that returns True if s reads the same backwards, ignoring case and spaces"]
hi-en = ["python mein is_palindrome(s) function likho jo True de agar s ulta padhne par bhi same ho, capital letters aur spaces ignore karke"]
solution = '''
def is_palindrome(s):
    t = s.replace(" ", "").lower()
    return t == t[::-1]
'''
tests = '''
assert is_palindrome("Madam") is True
assert is_palindrome("nurses run") is True
assert is_palindrome("hello") is False
assert is_palindrome("") is True
'''

[[family]]
id = "fn-vowels"
type = "function"
entry = "count_vowels"
en = ["write a function count_vowels(text) that returns how many vowels (a, e, i, o, u, upper or lower case) the text has"]
hi-en = ["count_vowels(text) naam ka function banao jo bataye text mein kitne vowels hain (a, e, i, o, u, capital bhi gino)"]
solution = '''
def count_vowels(text):
    return sum(c in "aeiou" for c in text.lower())
'''
tests = '''
assert count_vowels("Hello World") == 3
assert count_vowels("AEIOU") == 5
assert count_vowels("rhythm") == 0
assert count_vowels("") == 0
'''

[[family]]
id = "fn-second-largest"
type = "function"
entry = "second_largest"
en = ["write second_largest(nums): return the second largest distinct number in the list, or None if there is no such number"]
hi-en = ["second_largest(nums) function likho jo list ka doosra sabse bada alag number de, aur agar aisa number na ho to None"]
solution = '''
def second_largest(nums):
    distinct = sorted(set(nums), reverse=True)
    return distinct[1] if len(distinct) > 1 else None
'''
tests = '''
assert second_largest([4, 1, 9, 7]) == 7
assert second_largest([5, 5, 3]) == 3
assert second_largest([2, 2]) is None
assert second_largest([]) is None
assert second_largest([-1, -5, -3]) == -3
'''

[[family]]
id = "fn-word-counts"
type = "function"
entry = "word_counts"
en = ["write a python function word_counts(text) that returns a dict from each word (lowercased, without . , ! or ?) to how many times it appears"]
hi-en = ["word_counts(text) function banao jo dict de: har word (lowercase, . , ! ? hata ke) kitni baar aaya"]
solution = '''
def word_counts(text):
    counts = {}
    for w in text.lower().split():
        w = w.strip(".,!?")
        if w:
            counts[w] = counts.get(w, 0) + 1
    return counts
'''
tests = '''
assert word_counts("The cat and the hat.") == {"the": 2, "cat": 1, "and": 1, "hat": 1}
assert word_counts("Hi! hi?") == {"hi": 2}
assert word_counts("") == {}
'''

[[family]]
id = "fn-fizzbuzz"
type = "function"
entry = "fizzbuzz"
en = ["write fizzbuzz(n) that returns a list of strings for 1 to n: Fizz for multiples of 3, Buzz for multiples of 5, FizzBuzz for both, otherwise the number"]
hi-en = ["fizzbuzz(n) function likho jo 1 se n tak strings ki list de: 3 ke multiple pe Fizz, 5 ke pe Buzz, dono ke pe FizzBuzz, warna number hi"]
solution = '''
def fizzbuzz(n):
    out = []
    for i in range(1, n + 1):
        out.append("FizzBuzz" if i % 15 == 0 else "Fizz" if i % 3 == 0 else "Buzz" if i % 5 == 0 else str(i))
    return out
'''
tests = '''
assert fizzbuzz(5) == ["1", "2", "Fizz", "4", "Buzz"]
assert fizzbuzz(15)[-1] == "FizzBuzz"
assert fizzbuzz(0) == []
'''

[[family]]
id = "fn-grade"
type = "function"
entry = "grade"
en = ["write a function grade(marks) that returns A for 90 or more, B for 75 to 89, C for 50 to 74, and F below 50"]
hi-en = ["grade(marks) function banao: 90 ya usse zyada pe A, 75 se 89 pe B, 50 se 74 pe C, aur 50 se kam pe F"]
solution = '''
def grade(marks):
    if marks >= 90:
        return "A"
    if marks >= 75:
        return "B"
    if marks >= 50:
        return "C"
    return "F"
'''
tests = '''
assert grade(95) == "A"
assert grade(90) == "A"
assert grade(75) == "B"
assert grade(74) == "C"
assert grade(50) == "C"
assert grade(10) == "F"
'''

