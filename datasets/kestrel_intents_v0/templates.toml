# Kestrel-Intents-v0 templates (ADR-010). DRAFT by Claude, not yet reviewed by a human.
#
# One family = one request, written as English (en) and Romanized Hinglish (hi-en) templates.
# Families are split whole, so a translation never sits in a different set from its original.
# Labels and decision rules: docs/intent_ontology.md. Slots ({topic}, {task}, ...): fillers.toml.
# Out-of-scope families carry a domain; whole domains are split, so test OOS domains are unseen.
# Compound families (2+ intents, in the order asked) are evaluation-only: val/test, never train.
#
# Reviewing: read each line; fix wording in place; set `reviewed = true` on a family you accept
# (or flip default_reviewed once every family is done). `note` is for open questions.
# Check with: python experiments/data/intents_v0.py --check

schema = 1
default_author = "claude-draft"
default_reviewed = false

