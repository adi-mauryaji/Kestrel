# Kestrel-Kinds-v0 (DRAFT, ADR-037): which skill a request asks for, in English and Romanized Hinglish.
# Drafted by Claude on 2026-10-26; not yet reviewed by the human.
#
# kind: chat | email | rewrite | translate | app. `app` here holds only boundary requests that look like
# the new skills but belong to the existing path (sending is not drafting; a reminder to write is a task);
# the bulk of `app` comes from Kestrel-Intents-v0's train/cal/val items (experiments/data/kinds_v0.py).
# chat domains: advice, ideas, creative, decide, concepts. "concepts" (timeless explanations) is open:
# the human decides whether v3's chat may answer them (ADR-037); live or current facts stay `app`.

# ---------------------------------------------------------------- chat
[[family]]
id = "chat-01"
kind = "chat"
domain = "advice"
en = ["how can i focus better while studying?", "give me tips to concentrate when i study"]
hi-en = ["padhai mein focus kaise karun?", "padhte waqt dhyan kaise lagaun, kuch tips do"]

[[family]]
id = "chat-02"
kind = "chat"
domain = "advice"
en = ["how do i deal with exam stress?", "what should i do when exams make me anxious"]
hi-en = ["exam ka stress kaise handle karun?", "exams se ghabrahat hoti hai, kya karun"]

[[family]]
id = "chat-03"
kind = "chat"
domain = "ideas"
en = ["give me some ideas for my sister's birthday party", "what can we do for a small birthday party at home"]
hi-en = ["behen ki birthday party ke liye kuch ideas do", "ghar pe chhoti si birthday party mein kya kar sakte hain"]

[[family]]
id = "chat-04"
kind = "chat"
domain = "ideas"
en = ["suggest a few names for my bakery", "what could i call my new youtube channel about cooking"]
hi-en = ["meri bakery ke liye kuch naam suggest karo", "cooking wale youtube channel ka naam kya rakhun"]

[[family]]
id = "chat-05"
kind = "chat"
domain = "creative"
en = ["write a short poem about the rain", "can you write four lines about monsoon evenings"]
hi-en = ["baarish pe ek chhoti si kavita likho", "monsoon ki shaam pe chaar lines likh do"]

[[family]]
id = "chat-06"
kind = "chat"
domain = "creative"
en = ["write a bedtime story for a six year old", "make up a short story about a brave little cat"]
hi-en = ["chhe saal ke bacche ke liye ek bedtime story likho", "ek bahadur billi ki chhoti si kahani banao"]

[[family]]
id = "chat-07"
kind = "chat"
domain = "decide"
en = ["should i learn python or java first?", "is it better to buy a laptop now or wait for the sale"]
hi-en = ["pehle python seekhun ya java?", "laptop abhi lun ya sale ka wait karun"]

[[family]]
id = "chat-08"
kind = "chat"
domain = "decide"
en = ["help me plan a weekly study routine", "how should i split my day between work and the gym"]
hi-en = ["ek weekly study routine plan karne mein help karo", "kaam aur gym ke beech din kaise baantun"]

[[family]]
id = "chat-09"
kind = "chat"
domain = "concepts"
en = ["explain recursion in simple words", "what is recursion, explain like i'm new to coding"]
hi-en = ["recursion simple tarike se samjhao", "recursion kya hota hai, beginner ki tarah samjhao"]

[[family]]
id = "chat-10"
kind = "chat"
domain = "concepts"
en = ["how does photosynthesis work?", "explain photosynthesis to a school kid"]
hi-en = ["photosynthesis kaise kaam karta hai?", "photosynthesis ek school ke bacche ko samjhao"]

[[family]]
id = "chat-11"
kind = "chat"
domain = "concepts"
en = ["how do you make masala chai?", "what's the recipe for poha"]
hi-en = ["masala chai kaise banate hain?", "poha banane ki recipe batao"]

[[family]]
