# ---------------------------------------------------------------- rewrite (text given in the request)
[[family]]
id = "rewrite-01"
kind = "rewrite"
en = ["make this more formal: hey, can't make it tomorrow, sorry", "rewrite this formally: send me the report asap"]
hi-en = ["isko formal bana do: kal nahi aa paunga, sorry", "ye formal tareeke se likho: report jaldi bhejo"]

[[family]]
id = "rewrite-02"
kind = "rewrite"
en = ["shorten this: i wanted to let you know that the meeting has been moved to next week", "make this shorter please: we are writing to inform you that your order has shipped"]
hi-en = ["ise chhota kar do: maine socha aapko bata doon ki meeting agle hafte shift ho gayi hai", "thoda short kar do ye: aapka order ship ho gaya hai ye batane ke liye message kar rahe hain"]

[[family]]
id = "rewrite-03"
kind = "rewrite"
en = ["fix the grammar: me and him goes to school daily", "correct this sentence: she don't like coffee"]
hi-en = ["grammar theek karo: me and him goes to school daily", "is sentence ki galti sudhaar do: she don't like coffee"]

[[family]]
id = "rewrite-04"
kind = "rewrite"
en = ["make it polite: send me the file now", "say this nicely: you forgot to pay again"]
hi-en = ["isko polite bana do: abhi file bhejo", "ye pyaar se bolo: tumne phir se payment bhool gaye"]

[[family]]
id = "rewrite-05"
kind = "rewrite"
en = ["rewrite this in simple words: the committee has deferred the decision pending further review", "put this in plain english: remuneration will be disbursed upon completion"]
hi-en = ["aasaan shabdon mein likho: the committee has deferred the decision pending further review", "ise simple bana do: remuneration will be disbursed upon completion"]

[[family]]
id = "rewrite-06"
kind = "rewrite"
en = ["turn this into bullet points: buy milk, call the plumber, pay rent and book tickets", "make a bulleted list from this: eggs bread butter and tea"]
hi-en = ["isko points mein likh do: doodh lena, plumber ko bulana, rent bharna aur tickets book karna", "ise list bana do: ande, bread, butter aur chai patti"]

[[family]]
id = "rewrite-07"
kind = "rewrite"
en = ["make this sound friendlier: your request has been rejected", "rewrite this casually: please be informed that the party starts at 8"]
hi-en = ["isko thoda friendly bana do: aapki request reject ho gayi hai", "ye casual tareeke se likho: party 8 baje shuru hogi"]

[[family]]
id = "rewrite-08"
kind = "rewrite"
en = ["expand this into a full paragraph: project delayed, new date next month", "make this longer and more detailed: thanks for the help"]
hi-en = ["isko poora paragraph bana do: project late hai, nayi date agle mahine", "ise thoda detail mein likho: help ke liye thanks"]

[[family]]
id = "rewrite-09"
kind = "rewrite"
en = ["say this differently: i am very happy with your work", "paraphrase this: the train was late because of fog"]
hi-en = ["ise doosre shabdon mein likho: main aapke kaam se bahut khush hoon", "ye alag tareeke se bolo: kohre ki wajah se train late thi"]

[[family]]
id = "rewrite-10"
kind = "rewrite"
en = ["make this sound professional for linkedin: finally got the job yay", "polish this for my resume: did a lot of coding in college"]
hi-en = ["linkedin ke liye professional bana do: finally job mil gayi yay", "resume ke liye ise achha bana do: college mein bahut coding ki"]

[[family]]
id = "rewrite-11"
kind = "rewrite"
en = ["proofread this: i will reach their by 5 pm tommorow", "check the spelling in this: recieve the pakage at the gate"]
hi-en = ["ise proofread kar do: i will reach their by 5 pm tommorow", "spelling check karo: recieve the pakage at the gate"]

[[family]]
