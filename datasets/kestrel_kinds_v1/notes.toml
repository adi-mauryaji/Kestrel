en = ["who is the chief minister of maharashtra right now?", "who won yesterday's india match?"]
hi-en = ["maharashtra ka cm abhi kaun hai?", "kal india ka match kisne jeeta?"]

[[family]]
id = "app-v1-06"
kind = "app"
split = "train"  # ADR-042
