# ---- rewrite: the forms Kinds-v1's test missed ----

[[family]]
id = "rewrite-v2-01"
kind = "rewrite"
domain = "lists"
en = ["make this into a bulleted list: call the bank, renew the passport and book the train", "list these as points: rice, dal, oil and sugar"]
hi-en = ["isko bullet points mein likho: bank ko call karna, passport renew karna aur train book karna", "inko points mein likh do: chawal, dal, tel aur cheeni"]

[[family]]
id = "rewrite-v2-02"
kind = "rewrite"
domain = "captions"
en = ["turn this into an instagram caption: we finally visited the taj mahal", "make a short catchy line from this: our shop is open on sundays now"]
hi-en = ["isse instagram caption bana do: hum aakhir taj mahal dekh aaye", "isse ek catchy line banao: hamari dukaan ab sunday ko bhi khuli hai"]

[[family]]
id = "rewrite-v2-03"
kind = "rewrite"
domain = "expand"
en = ["expand this into a paragraph: meeting moved, budget approved, launch in june", "write this out in full sentences: exam tomorrow, room 204, bring id"]
hi-en = ["isko ek paragraph mein badha do: meeting shift hui, budget approve hua, launch june mein", "isko poore sentences mein likho: kal exam, room 204, id laana"]

[[family]]
id = "rewrite-v2-04"
kind = "rewrite"
domain = "short"
en = ["rewrite this as a tweet: our college fest starts this friday with music and food", "make this fit in one line: the library will stay closed on monday because of repairs"]
hi-en = ["isko tweet jaisa likho: hamara college fest is friday se shuru, music aur khana", "isko ek line mein karo: repair ki wajah se library monday ko band rahegi"]

[[family]]
id = "rewrite-v2-05"
kind = "rewrite"
domain = "summary"
en = ["summarize this in one line: the train was late by two hours so we missed the wedding lunch but reached for the evening", "give me a title for this: tips to save money on groceries every month"]
hi-en = ["ise ek line mein summarize karo: train do ghante late thi isliye shaadi ka lunch chhoot gaya par shaam tak pahunch gaye", "iska title batao: har mahine grocery pe paise bachane ke tips"]

