domain = "stories"
en = ["write a funny poem about mondays", "write a short story about a lost cat"]
hi-en = ["monday pe ek mazedaar kavita likho", "ek khoyi hui billi ki chhoti si kahani likho"]

# ---- app: boundaries ----

