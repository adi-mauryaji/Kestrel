# Kestrel-Kinds-v2 draft (ADR-044): the `code` kind and its boundaries, plus notes / rewrite / chat families of
# the types Kinds-v1's test missed. Kinds-v2 = Kinds-v1 (frozen) + these families (experiments/data/kinds_v2.py).
# Drafted by Claude on 2026-10-27; not yet reviewed by the human.
#
# code: write or fix Python (a function, a script, a class, a regex, tests; fixing given code or an error with its
# code), Qwen3-4B writes it. chat: explaining code or an error, programming concepts and advice, poems and stories
# (Gemma). app: a task or reminder about code, a named notes file, installing or checking something on a device.

# ---- code: write ----

[[family]]
id = "code-01"
kind = "code"
domain = "function"
en = ["write a python function that checks if a number is prime", "write a function to reverse a string"]
hi-en = ["prime number check karne ka python function likho", "string ulta karne wala function bana do"]

[[family]]
id = "code-02"
kind = "code"
domain = "script"
en = ["write a python script that reads a csv file and prints the total of the second column", "write a program that counts the words in a text file"]
hi-en = ["ek script likho jo csv file padhe aur doosre column ka total print kare", "text file ke words ginne ka program likho"]

[[family]]
id = "code-03"
kind = "code"
domain = "algorithm"
en = ["write a binary search in python", "sort a list of dictionaries by age in python"]
hi-en = ["python mein binary search likh do", "dictionaries ki list ko age ke hisaab se sort karne ka code do"]

[[family]]
id = "code-04"
kind = "code"
domain = "files"
en = ["write a script to rename all .txt files in a folder to .md", "python code to find duplicate lines in a file"]
hi-en = ["folder ki saari .txt files ko .md mein rename karne ki script likho", "file mein duplicate lines dhoondhne ka python code"]

[[family]]
id = "code-05"
kind = "code"
domain = "class"
en = ["write a python class for a bank account with deposit and withdraw", "make a simple stack class in python"]
hi-en = ["bank account ke liye python class banao jisme deposit aur withdraw ho", "python mein ek simple stack class bana do"]

[[family]]
id = "code-06"
kind = "code"
domain = "strings"
en = ["write a regex to check if an email address is valid", "python function to extract all numbers from a string"]
hi-en = ["email valid hai ya nahi check karne ka regex likho", "string se saare numbers nikalne ka python function"]

[[family]]
id = "code-07"
kind = "code"
domain = "program"
en = ["write a python program for a number guessing game", "create a simple calculator in python"]
hi-en = ["number guessing game ka python program likho", "python mein simple calculator banao"]

[[family]]
id = "code-08"
kind = "code"
domain = "dates"
en = ["python code to print today's date in dd-mm-yyyy format", "write a function that returns how many days are left until a given date"]
hi-en = ["aaj ki date dd-mm-yyyy format mein print karne ka python code", "ek function likho jo bataye di gayi date tak kitne din bache hain"]

[[family]]
id = "code-09"
kind = "code"
domain = "tests"
note = "changes code, so code, not rewrite"
en = ["write unit tests for this function: def square(x): return x * x", "add type hints to this function: def greet(name): return 'hi ' + name"]
hi-en = ["is function ke liye unit tests likho: def square(x): return x * x", "is function mein type hints add karo: def greet(name): return 'hi ' + name"]

# ---- code: fix or improve ----

[[family]]
id = "code-10"
kind = "code"
domain = "fix"
en = ["fix this function: def add(a, b): return a - b", "this loop never ends, fix it: while i < 10: print(i)"]
hi-en = ["is function ko sahi karo: def add(a, b): return a - b", "ye loop kabhi khatam nahi hota, isko fix karo: while i < 10: print(i)"]

[[family]]
id = "code-11"
kind = "code"
domain = "fix-error"
note = "an error with the code that gives it: fix it (code); an error asked about in general is chat-v2-02"
en = ["i'm getting KeyError: 'name' here, fix it: print(user['name'])", "why does this crash and how do i fix it: int('12a')"]
hi-en = ["yahan KeyError: 'name' aa raha hai, theek karo: print(user['name'])", "ye crash kyun hota hai, fix karo: int('12a')"]

[[family]]
id = "code-12"
kind = "code"
domain = "improve"
note = "rewriting code is code, rewriting text is rewrite"
en = ["make this code shorter: result = [] then for x in nums: if x > 0: result.append(x)", "rewrite this loop as a list comprehension: for x in range(10): squares.append(x * x)"]
hi-en = ["is code ko chhota karo: result = [] phir for x in nums: if x > 0: result.append(x)", "is loop ko list comprehension mein badlo: for x in range(10): squares.append(x * x)"]

# ---- chat: explaining code, concepts, advice ----

[[family]]
id = "chat-v2-01"
kind = "chat"
domain = "explain-code"
note = "explaining given code is chat (Gemma), changing it is code"
en = ["explain what this code does: print([x for x in range(5)])", "what does this line mean: x = y if y else 0"]
hi-en = ["ye code kya karta hai samjhao: print([x for x in range(5)])", "is line ka matlab kya hai: x = y if y else 0"]

[[family]]
id = "chat-v2-02"
kind = "chat"
domain = "explain-error"
en = ["why do i get IndentationError in python?", "what does 'NoneType object is not subscriptable' mean?"]
hi-en = ["python mein IndentationError kyun aata hai?", "'NoneType object is not subscriptable' ka matlab kya hai?"]

[[family]]
id = "chat-v2-03"
kind = "chat"
domain = "concepts"
en = ["what is the difference between a list and a tuple in python?", "how does a for loop work in python?"]
hi-en = ["python mein list aur tuple mein kya fark hai?", "python mein for loop kaise kaam karta hai?"]

[[family]]
id = "chat-v2-04"
kind = "chat"
domain = "advice"
en = ["how should i start learning python?", "which is better for web development, django or flask?"]
hi-en = ["python seekhna kaise shuru karun?", "web development ke liye django better hai ya flask?"]

[[family]]
