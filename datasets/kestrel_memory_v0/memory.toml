# Kestrel-Memory-v0 (DRAFT, ADR-026): a seeded memory store and retrieval queries for the Week-10
# baseline recall@k (blueprint Ch. 18). Synthetic, drafted by Claude on 2026-10-23; the human
# reviews it before it is frozen. Card: README.md. Builder: experiments/data/memory_v0.py.
#
# Every query runs against the whole store, as the running system would. Query types:
#   lexical    shares a content word with each expected memory (after stopwords, whole words)
#   paraphrase shares none: the lexical baseline cannot find it (risk K, Ch. 52 Week 10)
#   negative   nothing approved and unexpired answers it: ideally nothing comes back
# `trap` names memories that must never come back: pending model guesses, expired task history.
# The Rust check crates/kestrel-memory/tests/memory_v0.rs verifies the lexical/paraphrase labels.

now = "2026-10-23"          # retrieval time; ages and expiries are relative to it
default_author = "claude-draft"
default_reviewed = false

# --- memories: id, group (the split unit), kind, key, value, source, importance (1-5),
