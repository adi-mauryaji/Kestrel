# Kestrel-Personas-v0 (DRAFT, ADR-028): synthetic users who teach Kestrel their aliases, for E4.
# Drafted by Claude on 2026-10-23; the human reviews it before it is frozen. Card: README.md.
# Builder (the persona simulator): experiments/data/personas_v0.py. Label as synthetic in every table.
#
# A persona has 5 aliases (a document, a group of people, a note tag, a note count, a place or a
# date), taught one per scripted event (K = 1, 3, 5 events), and is then asked held-out requests:
# every request pattern of each alias kind in the persona's language (3 exact + 1 variant) and the
# general requests of its language (no alias). Placeholders: {a} the alias phrase, {v} its variant
# (a natural form exact matching misses), {t} what it means. A request's canonical form is the
# request as the user means it ({a} or {v} -> {t}); every canonical form must reach its expectation
# with the template planner (crates/.../personas_v0 check), which certifies the expectations.
#
# Expectation specs (computed by the builder against `today` and the fixture notes):
#   read = ["doc"]          the alias's document
#   read = ["recent:N"]     the N newest notes with the alias's tag (fewer if there are fewer)
#   read = ["recent"]       the alias's count of newest notes, any tag
#   read = ["recent:TAG:N"] (general requests) the N newest notes tagged TAG
#   due = "tomorrow" | "day_after" | "saturday" | "monday" | "friday" | "alias" (the alias's day)
# Rule for authors: a doc / tag / count alias never starts with "the" or "my" (patterns add them).

today = "2026-10-23"   # a Friday
notes = "fixtures/notes"
default_author = "claude-draft"
default_reviewed = true  # the human, 2026-10-26: experiments/logs/human/dataset_review.json

# --- teaching phrasings: event i of a persona uses template (persona index + i) mod 3 of its language
[[teach]]
lang = "en"
text = "when I say {a}, I mean {t}"
[[teach]]
lang = "en"
text = "no, by {a} I mean {t}"
[[teach]]
lang = "en"
text = "actually when I say {a} I mean {t}"
[[teach]]
lang = "hi-en"
text = "jab main {a} bolun to mera matlab {t} hai"
[[teach]]
lang = "hi-en"
text = "nahi, {a} se mera matlab {t} hai"
[[teach]]
lang = "hi-en"
text = "jab main {a} kahun toh matlab {t}"

