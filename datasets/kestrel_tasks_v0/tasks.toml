# Kestrel-Tasks-v0 (ADR-023): multi-step task evaluation with gold plans (blueprint Ch. 31, 14).
# DRAFT by Claude, 2026-10-22: every family needs the human's review before freezing (as Intents-v0,
# ADR-010 (4)). Frozen = any change makes a new version and a new fingerprint.
#
# One family = one request written in English (en) and Romanized Hinglish (hi-en), with ONE gold plan
# (the plan does not depend on the language) and the expected end state. Families are split whole.
# Gold plans are never shown to a model. Every run starts from a fresh copy of fixtures/notes and the
# seed state below; "today" is fixed so relative dates have one answer.
#
# expect: outcome = "done" (default) | "refused" (a step is blocked, e.g. by the sandbox) |
#   "clarify" (a required slot is missing: no plan, the planner must ask, never invent);
#   tasks_added = [{title, due?}] in creation order; tasks_deleted = [ids]; prefs_set = {key = value};
#   read = note names returned by the notes-producing steps, in plan order (search: ranked);
#   answer_contains = text a text-producing step must contain.
# Action items in fixture notes are lines "- [ ] ...", "Action: ..." or "TODO: ..." (MarkedItems), so the
# expected tasks are fixed; a model's own wording is scored in 9d by a rule set before that run.
# Check with: python experiments/data/tasks_v0.py --check

schema = 1
default_author = "claude-draft"
default_reviewed = true  # the human, 2026-10-26: experiments/logs/human/dataset_review.json

[fixture]
today = "2026-10-22"   # a Thursday
notes = "fixtures/notes"
tasks = [
  { id = 1, title = "call the plumber" },
  { id = 2, title = "renew passport", due = "2026-11-01" },
  { id = 3, title = "pay electricity bill", due = "2026-10-25" },
]
memories = ["Asha prefers calls after 6 pm", "The q4 budget is due on 2026-10-31", "Ravi is the project lead"]

